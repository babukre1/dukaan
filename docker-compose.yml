services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dukaanflow
      POSTGRES_USER: dukaanflow
      POSTGRES_PASSWORD: dukaanflow_dev
    ports:
      - "5432:5432"
    volumes:
      - dukaanflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukaanflow -d dukaanflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dukaanflow_postgres:
